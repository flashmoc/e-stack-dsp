<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Output Processing — E-Stack DSP</title><link rel="stylesheet" href="../../shared/tokens.css"><link rel="stylesheet" href="../../shared/base.css"><link rel="stylesheet" href="../../shared/components.css"><link rel="stylesheet" href="./page.css?v=output-peq-copy1"><link rel="stylesheet" href="../../shared/mobile.css?v=audio-polish1"></head>
<body><main class="output-page">
  <header class="output-toolbar"><div><h1>Output Processing</h1></div><div class="output-toolbar__actions"><output id="outputState" role="status" class="ui-status">CONNECTING</output><div class="processing-links" role="group" aria-label="Stereo processing links"><button type="button" data-processing-link="mid" aria-pressed="true">MID L/R · LINKED</button><button type="button" data-processing-link="high" aria-pressed="true">HIGH L/R · LINKED</button></div><button id="systemEdit" class="ui-button output-lock" type="button" aria-pressed="false">🔒 LOCKED</button></div></header>
  <section class="graph-section" aria-labelledby="graphHeading"><header class="graph-toolbar"><div class="toolbar-group"><span class="toolbar-label" id="graphHeading">RESPONSE</span><div class="segmented" role="group" aria-label="Graph display mode"><button data-graph-mode="magnitude" type="button">Magnitude</button><button data-graph-mode="phase" type="button">Phase</button><button data-graph-mode="xo" type="button">XO Align</button></div></div><div class="toolbar-group graph-options"><label>COMPARE <select id="compareWay" class="ui-select"></select></label><label class="toggle-label"><input id="allXos" type="checkbox" checked> All XOs</label><label class="toggle-label"><input id="analyzerEnabled" type="checkbox"> Analyzer</label></div><div id="analyzerControls" class="graph-secondary" hidden><span>ANALYZER</span><div class="segmented"><button data-analyzer-mode="raw" type="button">RAW</button><button data-analyzer-mode="fast" type="button">FAST</button><button data-analyzer-mode="slow" type="button">SLOW</button></div><label class="toggle-label"><input id="analyzerInfinite" type="checkbox"> Infinite</label><button id="analyzerReset" class="ui-button" type="button">Reset</button><div class="segmented analyzer-views"><button data-analyzer-view="full" type="button">Full</button><button data-analyzer-view="sub" type="button">Sub</button><button data-analyzer-view="low" type="button">Low</button><button data-analyzer-view="mid" type="button">Mid</button><button data-analyzer-view="high" type="button">High</button></div><output id="analyzerStatus">OFF</output></div></header><div class="graph-context"><div id="graphLegend" class="graph-legend"></div><span id="edgeContext"></span></div><div class="graph-wrap"><canvas id="responseGraph" width="1400" height="360" role="img" aria-label="Live selected-way response graph"></canvas></div><div class="graph-readout"><strong id="selectedWayTitle">RESPONSE</strong><span id="selectedWayMeta">Live DSP configuration</span><output id="graphState">LIVE DSP CONFIG</output></div><div id="xoControls" class="graph-secondary"><label>PAIR <select id="xoPair" class="ui-select"></select></label><output id="xoReadout">—</output></div><section class="way-strip" aria-label="Output way selection"><div id="waySelector" class="way-selector"></div></section></section>
  <section class="processor-section output-section" aria-labelledby="outputHeading"><header class="section-head"><div><strong id="outputHeading">ALIGNMENT</strong><span id="outputMeta">Selected way</span></div><div class="edit-state"><output id="editState" class="transaction">LOCKED</output></div></header><div id="outputControls" class="control-rack"></div><div id="protectionMetrics" class="protection-rail"></div></section>
  <section class="workspace-grid"><section class="processor-section peq-section" aria-labelledby="peqHeading"><header class="section-head"><div><strong id="peqHeading">PARAMETRIC EQ</strong><span id="peqMeta">Selected way</span></div><div class="section-actions"><button type="button" id="copyPeq" hidden></button><button type="button" id="addPeq">+ ADD PEQ</button></div></header><div class="peq-table-head" aria-hidden="true"><span>#</span><span>ON</span><span>TYPE</span><span>FREQUENCY</span><span>GAIN</span><span>Q</span><span>RESET</span><span>DEL</span></div><div id="peqRows" class="peq-editor"></div><p id="peqEmpty" class="peq-empty">No user EQ bands<span>+ Add PEQ to insert a band</span></p></section><section class="processor-section crossover-section" aria-labelledby="crossoverHeading"><header class="section-head"><div><strong id="crossoverHeading">CROSSOVER</strong><span>Filter edges · selected way</span></div><output id="crossoverScope" class="ui-badge">—</output></header><div id="crossoverControls" class="crossover-grid"></div></section></section>
</main><script src="../../shared/estack-dsp-bridge.js?v=output-v1"></script><script src="../../shared/domain/pipeline.js?v=topology-8ch1"></script><script src="../../shared/domain/output-processing-model.js?v=topology-8ch1"></script><script src="../../shared/domain/output-processing-service.js?v=output-peq-copy1"></script><script src="./graph-analysis.js?v=output-v5"></script><script src="./page.js?v=output-peq-copy1"></script></body></html>
