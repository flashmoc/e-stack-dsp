<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Control — E-Stack DSP</title><link rel="stylesheet" href="../../shared/tokens.css"><link rel="stylesheet" href="../../shared/base.css"><link rel="stylesheet" href="../../shared/components.css"><link rel="stylesheet" href="./page.css?v=control-v46"><link rel="stylesheet" href="./mixer-layout.css?v=control-v46"><link rel="stylesheet" href="./input-trim.css?v=control-v46"><link rel="stylesheet" href="../../shared/mobile.css?v=audio-polish1"><link rel="stylesheet" href="./control-polish.css?v=workspace-layout1"></head>
<body><main class="control-page">
  <header class="control-heading"><h1>Control</h1><span>Inputs &amp; outputs</span></header>
  <section class="ui-panel control-inputs" aria-labelledby="inputs-title"><header class="ui-panel__head"><div><h2 id="inputs-title">INPUTS</h2></div><div class="panel-actions"><label class="ui-toggle"><input id="analyzerToggle" type="checkbox" checked> Spectrum</label></div></header><div class="inputs-body"><div id="inputMeters" class="input-meters" aria-live="polite"></div><canvas id="inputScope" width="720" height="132" aria-label="Input spectrum analyzer"></canvas></div></section>
  <section class="ui-panel control-mixer" aria-label="Output mixer"><div id="protectionSummary" class="protection-summary" aria-label="Limiter status"></div><div id="mixerActions" class="mixer-actions"></div><div id="controlMixer" class="mixer-layout"></div></section>
  <section id="inputTrim" class="ui-panel input-trim-panel" aria-labelledby="input-trim-title"><div class="input-trim-intro"><span class="input-trim-kicker">GAIN STAGING</span><div><h2 id="input-trim-title">INPUT TRIM</h2><p>Digital L/R · post-ADC · before processing</p></div></div><div class="input-trim-control"><button id="inputTrimDown" type="button" aria-label="Reduce input trim">−</button><label><span>TRIM</span><input id="inputTrimRange" type="range" min="-20" max="12" step="0.5" value="0" aria-label="Input trim in dB"></label><div class="trim-value"><input id="inputTrimNumber" type="number" min="-20" max="12" step="0.5" value="0" aria-label="Input trim exact value in dB"><span>dB</span><output id="inputTrimValue" hidden>0.0 dB</output></div><button id="inputTrimUp" type="button" aria-label="Increase input trim">+</button></div><div class="input-trim-safe"><span>SAFE ADD</span><strong id="inputTrimAvailable">—</strong><small>conservative peak · 1.0 dB reserve</small><button id="inputTrimUse" type="button">USE HEADROOM</button></div></section>
<output id="controlStatus" role="status"></output></main><script src="../../shared/estack-dsp-bridge.js?v=control-v47"></script><script src="../../shared/domain/pipeline.js?v=control-v47"></script><script src="../../shared/domain/control-model.js?v=control-v47"></script><script src="../../shared/domain/control-service.js?v=control-v47"></script><script src="./fader-presentation.js?v=control-v48"></script><script src="./page.js?v=audio-polish1"></script></body></html>
