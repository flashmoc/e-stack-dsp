<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; frame-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>E-Stack DSP</title>
    <link rel="stylesheet" href="./shared/tokens.css?v=appearance1" />
    <link rel="stylesheet" href="./shared/base.css" />
    <link rel="stylesheet" href="./shared/components.css" />
    <link rel="stylesheet" href="./shared/shell.css" />
    <link
      rel="stylesheet"
      href="./shared/system-status.css?v=software-release1"
    />
  </head>
  <body>
    <div class="app-frame">
      <div class="environment-banner" hidden>
        <strong>Development preview</strong><span>DSP transport disabled</span>
      </div>
      <header class="shell-top">
        <div class="shell-brand">
          <span class="shell-mark">E</span>
          <div>
            <strong>E-Stack DSP</strong
            ><small>Speaker management workspace</small>
          </div>
        </div>
        <div class="shell-context">
          <span class="ui-status is-muted">CONNECTING</span>
        </div>
        <div class="shell-health" aria-label="Live system status">
          <div
            class="shell-metric"
            title="Peak audio amplitude relative to the closest hard limiter: 100% at its ceiling. Green below 70%, orange from 70%, red from 90%."
          >
            <span>AUDIO LOAD</span><strong data-shell-load>— %</strong>
          </div>
          <div
            class="shell-metric"
            title="Hard limiter coverage and margin from sampled output peaks. This is not a gain-reduction meter."
          >
            <span>HARD LIMITER</span
            ><strong data-shell-limiters>UNKNOWN</strong>
          </div>
          <div class="shell-metric">
            <span>MASTER</span><strong data-shell-master>— dB</strong>
          </div>
          <div
            class="shell-metric"
            title="Smallest margin to a hard limiter across unmuted outputs with signal"
          >
            <span>HEADROOM</span><strong data-shell-headroom>— dB</strong>
          </div>
        </div>
      </header>
      <nav class="shell-nav" aria-label="Main product navigation">
        <a
          data-page="control"
          data-group="Processing"
          class="group-start"
          href="./pages/control/page.html"
          >Control</a
        ><a
          data-page="input-processing"
          data-group="Processing"
          href="./pages/input-processing/page.html"
          >Input Processing</a
        ><a
          data-page="output-processing"
          data-group="Processing"
          href="./pages/output-processing/page.html"
          >Output Processing</a
        ><a
          data-page="loudness"
          data-group="Systems"
          class="group-start"
          href="./pages/loudness/page.html"
          >Loudness</a
        ><a
          data-page="system-presets"
          data-group="Systems"
          href="./pages/system-presets/page.html"
          >System Presets</a
        ><a
          data-page="signal-generator"
          data-group="Tools"
          class="group-start"
          href="./pages/signal-generator/page.html"
          >Signal Generator</a
        ><a
          data-page="measurement-batch"
          data-group="Tools"
          href="./pages/measurement-batch/page.html"
          >Measurement Batch</a
        ><a
          data-page="advanced"
          data-group="System"
          class="group-start"
          href="./pages/advanced/page.html"
          >Advanced</a
        ><a
          data-page="connections"
          data-group="System"
          href="./pages/connections/page.html"
          >Connections</a
        ><a
          data-page="preferences"
          data-group="System"
          href="./pages/preferences/page.html"
          >Preferences</a
        >
        <a class="shell-gui-link" data-camillagui hidden target="_blank" rel="noopener noreferrer" aria-label="Open CamillaGUI in a new tab">CamillaGUI ↗</a>
      </nav>
      <main class="shell-content">
        <iframe id="pageFrame" title="Selected E-Stack DSP workspace"></iframe>
      </main>
    </div>
    <script src="./shared/estack-dsp-bridge.js"></script>
    <script src="./shared/domain/pipeline.js"></script>
    <script src="./shared/domain/control-model.js"></script>
    <script src="./shared/domain/system-status.js?v=software-release1"></script>
    <script src="./shared/appearance.js?v=appearance1"></script>
    <script src="./shared/shell.js?v=appearance1"></script>
    <script src="./shared/system-status.js?v=software-release1"></script>
  </body>
</html>
